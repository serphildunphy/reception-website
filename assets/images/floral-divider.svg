<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="100%" height="60" fill="none">
  <defs>
    <linearGradient id="goldDivGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="20%" stop-color="#c9a84c" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fdf4db" stop-opacity="1"/>
      <stop offset="80%" stop-color="#c9a84c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldSolid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba62" />
      <stop offset="50%" stop-color="#fdf4db" />
      <stop offset="100%" stop-color="#9e7f2b" />
    </linearGradient>
  </defs>

  <!-- Left horizontal tapered rule -->
  <line x1="40" y1="30" x2="250" y2="30" stroke="url(#goldDivGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="210" cy="30" r="1.5" fill="url(#goldSolid)"/>
  <circle cx="230" cy="30" r="2.2" fill="url(#goldSolid)"/>

  <!-- Left Vine Tendril -->
  <path d="M 250 30 C 265 24 275 22 284 30" stroke="url(#goldSolid)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M 268 25 C 266 19 272 16 276 22 Z" fill="url(#goldSolid)"/>
  <path d="M 278 28 C 280 22 287 23 285 29 Z" fill="url(#goldSolid)"/>

  <!-- Central Flower / Rosette Crest -->
  <!-- Outer petaled diamond -->
  <circle cx="300" cy="30" r="14" stroke="url(#goldSolid)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <circle cx="300" cy="30" r="8" stroke="url(#goldSolid)" stroke-width="1.2"/>
  <polygon points="300,16 303,26 314,30 303,34 300,44 297,34 286,30 297,26" fill="url(#goldSolid)"/>
  <circle cx="300" cy="30" r="2.5" fill="#2c0915"/>
  <circle cx="300" cy="30" r="1.2" fill="url(#goldSolid)"/>

  <!-- Right Vine Tendril -->
  <path d="M 316 30 C 325 22 335 24 350 30" stroke="url(#goldSolid)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M 322 29 C 320 23 327 22 329 28 Z" fill="url(#goldSolid)"/>
  <path d="M 332 22 C 336 16 342 19 340 25 Z" fill="url(#goldSolid)"/>

  <!-- Right horizontal tapered rule -->
  <circle cx="370" cy="30" r="2.2" fill="url(#goldSolid)"/>
  <circle cx="390" cy="30" r="1.5" fill="url(#goldSolid)"/>
  <line x1="350" y1="30" x2="560" y2="30" stroke="url(#goldDivGrad)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
