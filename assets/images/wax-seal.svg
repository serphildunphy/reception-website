<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#691834" />
      <stop offset="50%" stop-color="#400b1d" />
      <stop offset="85%" stop-color="#260611" />
      <stop offset="100%" stop-color="#140208" />
    </radialGradient>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7b5" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#93721e" />
    </linearGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0d0105" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0d0105" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Organic Wax Seal Outer Rim -->
  <path d="M 60 6 
           C 72 4, 82 10, 93 14 
           C 104 18, 114 28, 116 40 
           C 118 52, 112 64, 113 76 
           C 114 88, 105 99, 94 106 
           C 83 113, 70 115, 57 114 
           C 44 113, 31 116, 20 108 
           C 9 100, 4 88, 5 75 
           C 6 62, 2 50, 6 38 
           C 10 26, 21 16, 33 11 
           C 44 6, 49 8, 60 6 Z" 
        fill="url(#waxGrad)" 
        filter="url(#waxShadow)"
        stroke="#7e203f" 
        stroke-width="1.5" />

  <!-- Inner Recessed Impression Circle -->
  <circle cx="60" cy="60" r="41" fill="#2d0815" stroke="url(#sealGold)" stroke-width="1.8" opacity="0.9"/>
  <circle cx="60" cy="60" r="37" fill="none" stroke="url(#sealGold)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Botanical Wreath inside wax impression -->
  <path d="M 32 60 C 32 46 43 35 58 34" stroke="url(#sealGold)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 88 60 C 88 46 77 35 62 34" stroke="url(#sealGold)" stroke-width="1.2" stroke-linecap="round"/>
  
  <path d="M 33 60 C 33 74 44 85 59 86" stroke="url(#sealGold)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 87 60 C 87 74 76 85 61 86" stroke="url(#sealGold)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Wax Seal Letter Monogram "R" or "&" symbol -->
  <text x="60" y="69" text-anchor="middle" font-family="'Cinzel Decorative', 'Playfair Display', serif" font-size="28" font-weight="600" fill="url(#sealGold)" letter-spacing="1">&amp;</text>
</svg>
